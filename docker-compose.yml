services:
  mysql:
    image: mysql:8.4
    container_name: narrative-studio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: narrative_studio
      MYSQL_USER: narrative
      MYSQL_PASSWORD: narrative_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - narrative_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unarrative", "-pnarrative_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  narrative_mysql_data:
