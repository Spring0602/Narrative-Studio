<text x="800" y="1280" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#294660" dominant-baseline="text-before-edge" text-anchor="middle">实线：调用；虚线：返回。校验失败时返回业务错误，不写入分支。</text>
